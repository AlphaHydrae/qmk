# From the qmk/qmk_userspace template. Builds every target in qmk.json on each
# push, and publishes the firmware as the "latest" GitHub release.
name: build

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  # Unit tests of the color logic, built with the runner's own C compiler. They
  # only need QMK's keycodes header, so qmk_firmware is checked out sparsely.
  test:
    name: 'Unit tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: master
          path: qmk_firmware
          sparse-checkout: quantum/keycodes.h
          sparse-checkout-cone-mode: false
      - run: make test QMK_HOME=qmk_firmware

  build:
    name: 'QMK Userspace Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master

  # Unlike the template, only publish successful builds of main, so that a
  # failed build or a branch push doesn't replace the "latest" release.
  publish:
    name: 'QMK Userspace Publish'
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
    if: needs.build.result == 'success' && needs.test.result == 'success' && github.ref == 'refs/heads/main'
    needs: [build, test]
